name: CI

# Runs on every PR to master and on pushes to master.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

# A new push to the same PR cancels the run that became outdated.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Release notes and the next version come from the commit subjects
  # (Conventional Commits), so a PR must follow them.
  commits:
    name: commits
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conventional Commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|perf|refactor|revert|docs|test|build|ci|chore|style)(\([a-z0-9-]+\))?!?: .+'
          bad=$(git log --no-merges --format='%s' "$BASE_SHA..$HEAD_SHA" | grep -Ev "$pattern" || true)
          if [ -n "$bad" ]; then
            echo "These commit subjects don't follow Conventional Commits (type: summary):"
            echo "$bad"
            exit 1
          fi

  checks:
    name: ${{ matrix.check }}
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [format, lint, typecheck, test, build]
    env:
      # The checks never need the Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: matrix.check == 'format'
        run: npx prettier --check .
      - if: matrix.check == 'lint'
        run: npm run lint:check
      - if: matrix.check == 'typecheck'
        run: npm run typecheck
      - if: matrix.check == 'test'
        run: npm test
      - if: matrix.check == 'build'
        run: npm run build
