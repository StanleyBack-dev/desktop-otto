name: Release

# Versioning (SemVer from Conventional Commits). On every push to master,
# release-please opens or updates the "chore: release x.y.z" PR with the new
# version in package.json and the CHANGELOG. Merging that PR creates the tag
# and the GitHub Release.
#
# With the RELEASE_PLEASE_TOKEN secret (fine-grained PAT: contents and pull
# requests, read and write), CI starts on the release PR and skips every job
# there. With the default GITHUB_TOKEN, CI doesn't start on it at all.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Always master, whatever the repository default branch is.
          target-branch: master
